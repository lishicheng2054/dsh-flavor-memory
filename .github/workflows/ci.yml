name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        run: npm install --no-audit --no-fund
      - name: syntax
        run: node --check src/core.mjs && node --check src/gateway.mjs && node --check src/dsh-plugin.mjs && node --check src/setup.mjs
      - name: test
        run: npm test
      - name: pack dry run
        run: npm pack --dry-run
